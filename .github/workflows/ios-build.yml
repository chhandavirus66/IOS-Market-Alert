name: Build iOS App (Flet)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Isse aap GitHub se manually bhi build start kar payenge

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build iOS App (Xcode Project)
        # 'yes |' lagaya hai taaki EOFError na aaye
        # '--no-codesign' isliye hai kyunki bina paid Apple Developer account ke direct .ipa sign nahi hoti
        run: yes | flet build ipa --no-codesign --verbose

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-files
          path: build/
          
