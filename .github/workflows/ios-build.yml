name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython kivy-ios

    - name: Build Kivy toolchain for iOS
      run: |
        toolchain build python3 kivy

    - name: Create Xcode Project
      run: |
        toolchain create MarketAlert .

    - name: Upload Xcode Project as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-xcode-project
        path: marketalert-ios/
        
